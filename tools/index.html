<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools 工具箱 | poorhack</title>
    <style>
        :root {
            --bg: #1b1e22;
            --bg-alt: #21252a;
            --text: #d6d9df;
            --text-dim: #8b8f96;
            --shadow-dark: #14171a;
            --shadow-light: #262b31;
            --accent: #00e6a8;
            --accent-soft: rgba(0,230,168,0.14);
            --accent-glow: rgba(0,230,168,0.40);
            --dot: rgba(255,255,255,0.045);
            --radius: 16px;
        }
        [data-theme="light"] {
            --bg: #e3e6ec;
            --bg-alt: #eef1f6;
            --text: #2a2e35;
            --text-dim: #6a6f79;
            --shadow-dark: #b8bcc4;
            --shadow-light: #ffffff;
            --accent: #00a877;
            --accent-soft: rgba(0,168,119,0.12);
            --accent-glow: rgba(0,168,119,0.30);
            --dot: rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
            background-size: 26px 26px;
            font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            color: var(--text);
            line-height: 1.55;
            padding: 24px;
            transition: background-color .3s, color .3s;
        }
        .shell { max-width: 1040px; margin: 0 auto; }

        .header { padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--accent-soft); }
        .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            display: grid; place-items: center; }
        .logo::after { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        h1 { font-size: 20px; font-weight: bold; letter-spacing: .5px; }
        .cursor { display: inline-block; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); animation: blink 1.1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .sub { color: var(--text-dim); font-size: 12px; margin-top: 8px; }
        .back { margin-top: 6px; }
        .back a { color: var(--accent); text-decoration: none; font-size: 12px; opacity: .85; }
        .back a:hover { opacity: 1; text-shadow: 0 0 8px var(--accent-glow); }

        .toggle { width: 64px; height: 32px; border-radius: 999px; position: relative; cursor: pointer;
            background: var(--bg); border: none; flex-shrink: 0;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transition: box-shadow .25s; }
        .toggle .knob { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
            background: var(--bg); box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: .25s; }
        [data-theme="light"] .toggle .knob { left: 36px; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
        #filter { flex: 1; padding: 12px 16px; font-family: inherit; font-size: 13px; color: var(--text);
            background: var(--bg); border: 1px solid transparent; border-radius: var(--radius);
            box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light); transition: .2s; }
        #filter::placeholder { color: var(--text-dim); }
        #filter:focus { outline: none; box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light), 0 0 0 1.5px var(--accent), 0 0 16px var(--accent-glow); }
        .count { font-size: 12px; color: var(--text-dim); white-space: nowrap; padding: 0 6px; }
        .count b { color: var(--accent); }

        .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
        .card { display: block; padding: 18px 18px 16px; border-radius: var(--radius); text-decoration: none; color: var(--text);
            background: var(--bg); box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
            transition: transform .18s, box-shadow .2s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent);
            box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light), 0 0 22px var(--accent-glow); }
        .card .name { font-weight: bold; font-size: 15px; color: var(--text); }
        .card:hover .name { color: var(--accent); }
        .card .desc { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
        .card .file { font-size: 11px; color: var(--text-dim); margin-top: 10px; opacity: .7; font-family: monospace; }
        .card .tag { display: inline-block; font-size: 10px; color: var(--accent); border: 1px solid var(--accent-soft);
            padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

        .footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--accent-soft); font-size: 12px; color: var(--text-dim); }
        .empty { color: var(--text-dim); padding: 18px; text-align: center; }
        @media (max-width: 560px) { .toolbar { flex-direction: column; align-items: stretch; } .count { text-align: right; } }
    </style>
</head>
<body data-theme="dark">
<div class="shell">
    <div class="header">
        <div class="title-row">
            <div class="brand">
                <div class="logo" aria-hidden="true"></div>
                <h1>Tools 工具箱<span class="cursor">▍</span></h1>
            </div>
            <button class="toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
                <span class="knob"></span>
            </button>
        </div>
        <div class="sub">poorhack.github.io/tools — 小工具集合入口</div>
        <div class="back"><a href="../webtest/index.html">← 返回 WebTest 测试页入口</a></div>
    </div>

    <div class="toolbar">
        <input type="text" id="filter" placeholder="> 输入关键字过滤（名称/描述/路径）..." autocomplete="off">
        <span class="count" id="count"></span>
    </div>

    <div id="root" class="links"></div>

    <div class="footer">共 <span id="total">0</span> 个工具 · 点击卡片打开（新标签页）</div>
</div>

<script>
(function() {
    const items = [
        { file: 'qr.html',       name: '二维码生成与解析',  desc: 'QR Code 生成与扫码解析' },
        { file: 'gifgen/',       name: 'GIF 图片生成器',    desc: '在线 GIF 生成（gifgen 子目录）' },
        { file: 'UIViewer.html', name: 'Android UI Viewer', desc: 'Android 布局结构查看器' },
        { file: 'anti.html',    name: 'Debugger 拦截',     desc: '反调试 / 调试器拦截脚本（原 webtest/stress/anti.html）' },
    ];

    const root = document.getElementById('root');
    const filterInput = document.getElementById('filter');
    const countEl = document.getElementById('count');
    const totalEl = document.getElementById('total');
    totalEl.textContent = items.length;

    function render(query) {
        const q = (query || '').trim().toLowerCase();
        const list = items.filter(it => !q || (it.name + ' ' + it.desc + ' ' + it.file).toLowerCase().indexOf(q) !== -1);
        if (list.length === 0) { root.className = 'empty'; root.textContent = '无匹配的工具。'; countEl.innerHTML = '显示 <b>0</b> / ' + items.length; return; }
        let html = '';
        list.forEach(it => {
            html += '<a class="card" href="' + it.file + '" target="_blank" rel="noopener noreferrer">';
            html += '<div class="name">' + it.name + '</div>';
            html += '<div class="desc">' + it.desc + '</div>';
            html += '<div class="file">' + it.file + '</div>';
            html += '</a>';
        });
        root.className = 'links';
        root.innerHTML = html;
        countEl.innerHTML = '显示 <b>' + list.length + '</b> / ' + items.length;
    }

    render('');
    filterInput.addEventListener('input', function() { render(this.value); });

    const toggle = document.getElementById('themeToggle');
    function applyTheme(t) {
        document.body.setAttribute('data-theme', t);
        toggle.setAttribute('aria-checked', t === 'light' ? 'true' : 'false');
        try { localStorage.setItem('theme', t); } catch (e) {}
    }
    (function init() {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        if (!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        applyTheme(saved);
    })();
    toggle.addEventListener('click', function() {
        applyTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
})();
</script>
</body>
</html>
