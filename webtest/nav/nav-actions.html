<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转/剪贴板测试 (合并)</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        .tabs { border-bottom: 2px solid #888; margin-bottom: 12px; }
        .tab-btn { background: #eee; border: 1px solid #888; border-bottom: none; padding: 4px 12px; cursor: pointer; font-family: monospace; }
        .tab-btn.active { background: #fff; font-weight: bold; }
        .tab-panel { display: none; padding: 8px; border: 1px solid #ccc; border-top: none; }
        .tab-panel.active { display: block; }
        button, .btn { background: #eee; border: 1px solid #888; padding: 4px 12px; cursor: pointer; font-family: monospace; font-size: 13px; margin: 4px; text-decoration: none; color: black; display: inline-block; }
        .note { color: #555; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
<h3>跳转 / 剪贴板测试</h3>
<div class="tabs">
    <button class="tab-btn active" data-tab="open">打开新窗口 (open)</button>
    <button class="tab-btn" data-tab="copy">剪贴板 + scheme (copy)</button>
     <button class="tab-btn" data-tab="copy2">document.execCommand('copy') 复制文本</button>
</div>

<div id="open" class="tab-panel active">
    <button id="baidu">点击打开百度</button>
    <button id="bing">点击打开bing</button>
    <script>
        document.getElementById('baidu').addEventListener('click', function() { window.open('https://www.baidu.com'); });
        document.getElementById('bing').addEventListener('click', function() { window.open('https://www.bing.com'); });
    </script>
</div>

<div id="copy" class="tab-panel">
    <button id="copyButton">navigator.clipboard.writeText 复制文本</button>
    <script>
        document.getElementById('copyButton').addEventListener('click', async function() {
            try {
                await navigator.clipboard.writeText('这是要复制的文本');
                alert('文本已复制!');
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            }
        });
    </script>
</div>

<div id="copy2" class="tab-panel">
    <input id="myInput" type="text" value="复制文本2"/><br>
    <button id="copyBtn">document.execCommand('copy') 复制文本</button>
    <script>
        function copyFromInput(inputElement) {
          // 1. 选中输入框内的文本
          inputElement.select();
          inputElement.setSelectionRange(0, 99999); // 兼容移动端
        
          try {
            // 2. 执行复制命令，返回布尔值表示是否成功
            const success = document.execCommand('copy');
            console.log(success ? '复制成功' : '复制失败');
          } catch (err) {
            console.error('复制出错：', err);
          }
        }
        
        // 必须在用户点击等交互事件中调用
        document.querySelector('#copyBtn').addEventListener('click', () => {
          copyFromInput(document.querySelector('#myInput'));
        });
    </script>
</div>
<script>
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
