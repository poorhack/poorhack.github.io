<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄像头测试 (合并)</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        .tabs { border-bottom: 2px solid #888; margin-bottom: 12px; }
        .tab-btn { background: #eee; border: 1px solid #888; border-bottom: none; padding: 4px 12px; cursor: pointer; font-family: monospace; }
        .tab-btn.active { background: #fff; font-weight: bold; }
        .tab-panel { display: none; padding: 8px; border: 1px solid #ccc; border-top: none; }
        .tab-panel.active { display: block; }
        video { background: #000; }
        .button { display: inline-block; background: #eee; border: 1px solid #888; padding: 4px 10px; cursor: pointer; margin: 4px; }
    </style>
</head>
<body>
<h3>摄像头测试</h3>
<div class="tabs">
    <button class="tab-btn active" data-tab="snap">截图 (cam)</button>
    <button class="tab-btn" data-tab="rec">录制 (cam2)</button>
</div>

<div id="snap" class="tab-panel active">
    <h4>方式一：开启摄像头并截图</h4>
    <video id="video" width="300" height="300" autoplay></video>
    <canvas id="canvas" width="300" height="300"></canvas>
    <br>
    <input type="button" value="开启摄像头" onclick="getMedia()">
    <input type="button" value="关闭摄像头" onclick="stopMedia(document.getElementById('video'))">
    <button onclick="takePhoto()">拍照</button>
    <hr>
    <h4>方式二：选择摄像头预览</h4>
    <video id="videoPreview" autoplay playsinline style="width:300px;height:300px;"></video>
    <select id="cameraSelect"></select>
    <button onclick="startCamera()">开始预览</button>
    <script>
        function getMedia() {
            var constraints = { video: { width: 500, height: 500 }, audio: true };
            var video = document.getElementById("video");
            navigator.mediaDevices.getUserMedia(constraints).then(function(MediaStream) {
                video.srcObject = MediaStream; video.play();
            });
        }
        function takePhoto() {
            var canvas = document.getElementById("canvas");
            var ctx = canvas.getContext('2d');
            ctx.drawImage(document.getElementById("video"), 0, 0, 300, 300);
        }
        function stopMedia(videoElem) {
            var stream = videoElem.srcObject;
            if (stream) { stream.getTracks().forEach(function(track) { track.stop(); }); }
            videoElem.srcObject = null;
        }
        var videoEle = document.getElementById('videoPreview');
        var selectEle = document.getElementById('cameraSelect');
        async function getCameraDevices() {
            var devices = await navigator.mediaDevices.enumerateDevices();
            var videoDevs = devices.filter(function(d) { return d.kind === 'videoinput'; });
            selectEle.innerHTML = '';
            videoDevs.forEach(function(device, index) {
                var option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || ('摄像头 ' + (index + 1));
                selectEle.appendChild(option);
            });
        }
        async function startCamera() {
            var selectedId = selectEle.value;
            var constraints2 = { video: { deviceId: selectedId ? { exact: selectedId } : undefined } };
            var stream = await navigator.mediaDevices.getUserMedia(constraints2);
            videoEle.srcObject = stream;
        }
        window.addEventListener('load', getCameraDevices);
    </script>
</div>

<div id="rec" class="tab-panel">
    <div class="button" id="startButton">Start</div>
    <h4>Preview</h4>
    <video id="preview" width="50%" height="auto" autoplay muted></video>
    <div class="button" id="stopButton">Stop</div>
    <a id="downloadButton" class="button">Download</a>
    <h4>Recording</h4>
    <video id="recording" width="160" height="120" controls></video>
    <script>
        (function() {
            var preview = document.getElementById("preview");
            var recording = document.getElementById("recording");
            var startButton = document.getElementById("startButton");
            var stopButton = document.getElementById("stopButton");
            var downloadButton = document.getElementById("downloadButton");
            var dataChunks = [];
            var recorder;
            function startRecording(stream) {
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = function(event) { dataChunks.push(event.data); };
                recorder.start(1000);
                console.log(recorder.state + " start to recording .....");
            }
            stopButton.addEventListener("click", function() {
                preview.srcObject.getTracks().forEach(function(track) { track.stop(); });
                recorder.stop();
                var recordedBlob = new Blob(dataChunks, { type: "video/webm" });
                recording.src = URL.createObjectURL(recordedBlob);
                downloadButton.href = recording.src;
                downloadButton.download = "RecordedVideo.webm";
            });
            startButton.addEventListener("click", function() {
                navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then(function(stream) {
                    preview.srcObject = stream;
                    downloadButton.href = stream;
                    preview.captureStream = preview.captureStream || preview.mozCaptureStream;
                    startRecording(preview.captureStream());
                }).catch(function(err) { console.log("recording error: ", err); });
            });
        })();
    </script>
</div>

<script>
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
