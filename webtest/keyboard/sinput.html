<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软键盘覆盖输入框 Demo</title>
<style>
  * { margin: 0; padding: 0; }
  body { height: 100vh; }

  /* fixed + top 定位在底部，软键盘会覆盖输入框 */
  .dialog {
    position: fixed;
    left: 0;
    top: calc(100vh - 100px);
    width: 100%;
    height: 100px;
    background: #fff;
    border-top: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .dialog input {
    width: 80%;
    height: 36px;
    padding: 0 8px;
    font-size: 16px;
    border: 1px solid #999;
    border-radius: 4px;
  }
  .wrap {
    display: flex;
    gap: 24px;
    /* flex-wrap: wrap; */
    justify-content: center;
  }
  .card {
    width: 280px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    background: #fff;
  }
  .swatch {
    height: 180px;
  }
  .info {
    padding: 16px 18px;
  }
  .info h2 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .info p {
    margin: 4px 0;
    font-size: 14px;
    color: #555;
  }
  code {
    background: #f0f0f2;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="swatch" style="background:#5291FF"></div>
      <div class="info">
        <h2>0xFF5291FF</h2>
        <p>不透明色：<code>#5291FF</code></p>
        <p>RGB：82, 145, 255</p>
        <p>明亮天蓝色，偏冷、饱和度较高</p>
      </div>
    </div>

    <div class="card">
      <div class="swatch" style="background:#0A59F7"></div>
      <div class="info">
        <h2>0xFF0A59F7</h2>
        <p>不透明色：<code>#0A59F7</code></p>
        <p>RGB：10, 89, 247</p>
        <p>更深的鲜蓝色/电光蓝，更浓更饱和</p>
      </div>
    </div>
  </div>
 <div style="display: flex; justify-content: center;">
  <input type="text" style="caret-color: #ce0e2d;" placeholder="测试光标，期望红色" />
</div>
<div class="dialog">
  <input type="text" style="caret-color: #ce0e2d;" placeholder="输入后软键盘会覆盖我" />
</div>
</body>
</html>
