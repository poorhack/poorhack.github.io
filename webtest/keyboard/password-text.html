<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码保存 - text→password切换</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        form { margin-bottom: 16px; padding: 8px; border: 1px dashed #aaa; }
        input { margin: 2px; }
        .note { color: #555; font-size: 12px; }
        .back { margin-top: 16px; }
        .back a { color: #06c; font-size: 12px; }
    </style>
</head>
<body>
<h3>密码保存 - 方式4：text→password切换</h3>
<div class="note">密码框初始为 type="text"，聚焦时切换为 type="password"。测试浏览器能否识别并保存/自动填充。</div>
<form id="myform4" action="tim.html">
    用户名：<input type="text" id="username4" name="UserName"><br/>
    密码：<input type="text" id="password4" name="Password" onfocus="this.type='password'"><br/>
    <button type="submit">submit</button>
</form>
<div class="back"><a href="password.html">← 返回密码保存测试入口</a></div>
<script>
    document.getElementById('myform4').addEventListener('submit', function() {
        console.log('用户名:', document.getElementById('username4').value);
        console.log('密码:', document.getElementById('password4').value);
        console.log('密码框当前 type:', document.getElementById('password4').type);
    });
</script>
</body>
</html>
