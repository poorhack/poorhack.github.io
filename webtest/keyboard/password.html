<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码保存测试 (合并)</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        .tabs { border-bottom: 2px solid #888; margin-bottom: 12px; }
        .tab-btn { background: #eee; border: 1px solid #888; border-bottom: none; padding: 4px 12px; cursor: pointer; font-family: monospace; }
        .tab-btn.active { background: #fff; font-weight: bold; }
        .tab-panel { display: none; padding: 8px; border: 1px solid #ccc; border-top: none; }
        .tab-panel.active { display: block; }
        form { margin-bottom: 16px; padding: 8px; border: 1px dashed #aaa; }
        input { margin: 2px; }
        .note { color: #555; font-size: 12px; }
    </style>
</head>
<body>
<h3>密码保存测试</h3>
<div class="tabs">
    <button class="tab-btn active" data-tab="p1">方式1 (onfocus清空)</button>
    <button class="tab-btn" data-tab="p2">方式2 (readonly陷阱)</button>
    <button class="tab-btn" data-tab="p3">方式3 (one-time-code)</button>
</div>

<div id="p1" class="tab-panel active">
    <div class="note">提交后控制台输出用户名/密码，浏览器可提示保存密码。</div>
    <form id="myform1" action="tim.html">
        用户名：<input type="text" id="username1" onfocus="this.value='';"><br/>
        密码：<input type="password" id="password1" onfocus="this.value='';"><br/>
        <button type="submit">submit</button>
        <div>
            <label for="salutation">称呼 *</label>
            <select required id="salutation" name="ulp-salutation">
                <option hidden disabled selected value=""></option>
                <option value="0001">先生</option>
                <option value="0005">女士</option>
            </select>
        </div>
    </form>
</div>

<div id="p2" class="tab-panel">
    <div class="note">用 readonly + onfocus 移除属性，规避浏览器自动填充。</div>
    <form id="myform2" action="tim.html">
        用户名：<input type="text" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" id="username2"><br/>
        密码：<input type="password" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" id="password2"><br/>
        <button type="submit">submit</button>
    </form>
</div>

<div id="p3" class="tab-panel">
    <div class="note">autocomplete="one-time-code" 场景。</div>
    <form id="myform3" action="tim.html">
        用户名：<input type="text" placeholder="User Name / Email" name="UserName"><br/>
        密码：<input type="password" placeholder="Password" autocomplete="one-time-code" name="Password"><br/>
        <button type="submit">submit</button>
    </form>
</div>

<script>
    document.getElementById('myform1').addEventListener('submit', function() {
        console.log('用户名:', document.getElementById('username1').value);
        console.log('密码:', document.getElementById('password1').value);
    });
    document.getElementById('myform2').addEventListener('submit', function() {
        console.log('用户名:', document.getElementById('username2').value);
        console.log('密码:', document.getElementById('password2').value);
    });
    document.getElementById('myform3').addEventListener('submit', function() {
        this.querySelectorAll('input[type="text"], input[type="password"]').forEach(function(input) {
            console.log((input.type === 'text' ? '用户名' : '密码') + ':', input.value);
        });
    });

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
