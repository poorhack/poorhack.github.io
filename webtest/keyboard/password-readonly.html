<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码保存 - readonly陷阱</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        form { margin-bottom: 16px; padding: 8px; border: 1px dashed #aaa; }
        input { margin: 2px; }
        .note { color: #555; font-size: 12px; }
        .back { margin-top: 16px; }
        .back a { color: #06c; font-size: 12px; }
    </style>
</head>
<body>
<h3>密码保存 - 方式2：readonly陷阱</h3>
<div class="note">用 readonly + onfocus 移除属性，规避浏览器自动填充。</div>
<form id="myform2" action="tim.html">
    用户名：<input type="text" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" id="username2"><br/>
    密码：<input type="password" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" id="password2"><br/>
    <button type="submit">submit</button>
</form>
<div class="back"><a href="password.html">← 返回密码保存测试入口</a></div>
<script>
    document.getElementById('myform2').addEventListener('submit', function() {
        console.log('用户名:', document.getElementById('username2').value);
        console.log('密码:', document.getElementById('password2').value);
    });
</script>
</body>
</html>
