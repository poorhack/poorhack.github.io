<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码保存 - one-time-code</title>
    <style>
        body { font-family: monospace; padding: 16px; font-size: 14px; }
        form { margin-bottom: 16px; padding: 8px; border: 1px dashed #aaa; }
        input { margin: 2px; }
        .note { color: #555; font-size: 12px; }
        .back { margin-top: 16px; }
        .back a { color: #06c; font-size: 12px; }
    </style>
</head>
<body>
<h3>密码保存 - 方式3：one-time-code</h3>
<div class="note">autocomplete="one-time-code" 场景。</div>
<form id="myform3" action="tim.html">
    用户名：<input type="text" placeholder="User Name / Email" name="UserName"><br/>
    密码：<input type="password" placeholder="Password" autocomplete="one-time-code" name="Password"><br/>
    <button type="submit">submit</button>
</form>
<div class="back"><a href="password.html">← 返回密码保存测试入口</a></div>
<script>
    document.getElementById('myform3').addEventListener('submit', function() {
        this.querySelectorAll('input[type="text"], input[type="password"]').forEach(function(input) {
            console.log((input.type === 'text' ? '用户名' : '密码') + ':', input.value);
        });
    });
</script>
</body>
</html>
